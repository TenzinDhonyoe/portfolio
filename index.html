<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenzin Dhonyoe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --page: #faf9f7;
        --ink: #1a1a1a;
        --muted: #6b6560;
        --rule: #e0dbd5;
        --accent: #c44d2b;
        --panel: #ffffff;
        --hover: rgba(0, 0, 0, 0.015);
      }

      body {
        background: var(--page);
        color: var(--ink);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent);
        color: white;
      }

      a { color: inherit; text-decoration: none; }

      /* ---- Stage ---- */
      #stage {
        position: relative;
        width: min(1100px, 100%);
        margin: 0 auto;
        min-height: 100vh;
        overflow: hidden;
      }

      /* ---- Headline (Pretext-fitted) ---- */
      .headline-line {
        position: absolute;
        font-family: 'Newsreader', Georgia, serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
        white-space: nowrap;
      }

      /* ---- Subtitle ---- */
      .subtitle {
        position: absolute;
        font: 15px 'Inter', sans-serif;
        color: var(--muted);
        letter-spacing: 0.01em;
      }

      /* ---- Links ---- */
      .links-nav {
        position: absolute;
        display: flex;
        gap: 20px;
        font-size: 14px;
        font-weight: 500;
      }

      .links-nav a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        transition: color 150ms ease;
      }

      .links-nav a:hover {
        color: var(--ink);
      }

      .links-nav svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      /* ---- Body lines (Pretext-laid) ---- */
      .body-line {
        position: absolute;
        font: 17px 'Inter', -apple-system, sans-serif;
        line-height: 28px;
        color: var(--ink);
        white-space: nowrap;
      }

      /* ---- ECG Canvas ---- */
      .ecg-canvas {
        position: absolute;
        cursor: pointer;
        pointer-events: auto !important;
        border-radius: 8px;
      }

      .ecg-hint {
        position: absolute;
        font: 11px 'Inter', sans-serif;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
        text-align: center;
        opacity: 0.6;
        transition: opacity 0.6s ease;
      }

      .ecg-hint.faded {
        opacity: 0;
        pointer-events: none;
      }

      /* ---- Section label ---- */
      .section-label {
        position: absolute;
        font: 600 11px 'Inter', sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      /* ---- Masonry ---- */
      .masonry-container {
        position: absolute;
      }

      /* ---- Project cards ---- */
      .project-card {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 200ms ease, box-shadow 200ms ease;
      }

      .project-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }

      .card-link {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 20px;
        height: 100%;
        color: inherit;
        text-decoration: none;
      }

      .card-title {
        font: 600 15px/1.3 'Inter', sans-serif;
        color: var(--ink);
      }

      .card-tag {
        font: 500 11px 'Inter', sans-serif;
        color: var(--accent);
        letter-spacing: 0.03em;
        margin-bottom: 6px;
      }

      .card-text {
        font: 400 15px/23px 'Inter', sans-serif;
        color: var(--muted);
        margin: 0;
      }

      /* ---- Footer ---- */
      .footer {
        position: absolute;
        font: 13px 'Inter', sans-serif;
        color: var(--muted);
        padding-top: 20px;
        border-top: 1px solid var(--rule);
      }

      /* ---- Dark Mode ---- */
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #141312;
          --ink: #e8e4df;
          --muted: #908880;
          --rule: #2a2725;
          --accent: #e8734f;
          --panel: #1c1a18;
          --hover: rgba(255, 255, 255, 0.03);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .project-card,
        .ecg-hint,
        .links-nav a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
