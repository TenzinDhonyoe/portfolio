<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{name}}</title>
    <meta name="description" content="{{description}}" />
    <meta property="og:title" content="{{name}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%230a0a0a'><circle cx='30' cy='30' r='9'/><circle cx='70' cy='30' r='9'/><circle cx='30' cy='70' r='9'/><circle cx='70' cy='70' r='9'/><circle cx='50' cy='50' r='9'/></g></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="preload" href="/assets/portrait.jpg" as="image" />
    <!-- Theme before first paint: the saved choice, else the system setting. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      :root {
        --page: #ffffff;
        --ink: #0a0a0a;
        --ink-2: #5f5f5c;
        --ink-3: #a1a19c;
        --line: #ececea;
        --stage: #ffffff;
        --edge: #f7f7f6;
        --gutter: clamp(20px, 4vw, 64px);
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --page: #0f0f10;
        --ink: #f2f1ed;
        --ink-2: #a3a29c;
        --ink-3: #6c6b67;
        --line: #252528;
        --stage: #1b1b1e;
        --edge: #0c0c0d;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--ink); }
      /* A soft studio light behind the dots, falling off to the page colour. */
      body { background: radial-gradient(ellipse 75% 70% at 50% 42%, var(--stage) 0%, var(--page) 60%, var(--edge) 100%) var(--page); }
      html, body, .links a, .list li, .list { transition: background-color 0.35s, border-color 0.35s, color 0.35s; }
      body {
        font: 16px/1.6 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
      }
      ::selection { background: var(--ink); color: var(--page); }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 2px; }

      .theme {
        position: fixed; z-index: 2; top: 20px; right: var(--gutter);
        width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
        border: 1px solid var(--line); border-radius: 999px;
        background: transparent; color: var(--ink); cursor: pointer;
        transition: border-color 0.2s, background-color 0.2s;
      }
      .theme:hover { border-color: var(--ink-3); }
      .theme svg { width: 16px; height: 16px; }
      .theme .sun, :root[data-theme='dark'] .theme .moon { display: none; }
      :root[data-theme='dark'] .theme .sun { display: block; }

      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

      .page {
        position: relative;
        height: 100vh;
        height: 100svh;
        display: grid;
        grid-template-columns: minmax(260px, 23rem) minmax(0, 1fr) minmax(300px, 23rem);
        gap: 24px;
        align-items: center;
        padding: 40px var(--gutter);
      }


      /* ---- Left: who ---- */
      h1 {
        margin: 0;
        font-weight: 600;
        font-size: clamp(2.5rem, 1.2rem + 2.9vw, 4.4rem);
        line-height: 1;
        letter-spacing: -0.045em;
      }
      .hello { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 400; line-height: 1.6; letter-spacing: 0; color: var(--ink-3); }
      .lede + .lede { margin-top: 12px; }
      .lede { margin: 22px 0 0; max-width: 21rem; color: var(--ink-2); font-size: 16px; line-height: 1.55; text-wrap: pretty; }
      .links { display: flex; gap: 20px; margin-top: 26px; font-size: 14px; font-weight: 500; }
      .links a { display: inline-flex; gap: 4px; padding: 2px 0; border-bottom: 1px solid var(--line); transition: border-color 0.2s; }
      .links a::after { content: '↗'; color: var(--ink-3); font-weight: 400; }
      .links a:hover { border-color: var(--ink); }

      /* ---- Middle: the dots live here ---- */
      .slot { align-self: stretch; position: relative; min-height: 0; }
      .caption {
        position: absolute; left: 0; right: 0; bottom: 4px;
        margin: 0 auto; max-width: 30rem; padding: 0 12px;
        text-align: center; font-size: 14px; line-height: 1.5; color: var(--ink-2);
        min-height: 4.7em;
      }
      .caption b { display: block; font-weight: 500; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
      .caption.in { animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
      .hint-touch { display: none; }
      @media (hover: none) {
        .hint-touch { display: inline; }
        .hint-mouse { display: none; }
      }

      /* ---- Right: work and life ---- */
      .work { justify-self: end; width: 100%; }
      .tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 12px; }
      .tabs button {
        font: inherit; font-size: 14px; font-weight: 500; color: var(--ink-3);
        background: none; border: 0; padding: 4px 0; cursor: pointer; position: relative;
        transition: color 0.2s;
      }
      .tabs button sup { font-size: 10px; font-weight: 400; margin-left: 2px; font-variant-numeric: tabular-nums; }
      .tabs button::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 1.5px;
        background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .tabs button:hover { color: var(--ink-2); }
      .tabs button[aria-selected='true'] { color: var(--ink); }
      .tabs button[aria-selected='true']::after { transform: none; }
      /* Both lists share one cell, so switching never moves the column. */
      .lists { display: grid; }
      .lists > .list { grid-area: 1 / 1; transition: opacity 0.3s, visibility 0.3s; }
      .lists > .list[inert] { opacity: 0; visibility: hidden; }
      .list { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); align-self: start; }
      .list li { border-top: 1px solid var(--line); }
      .row {
        width: 100%; font: inherit; color: inherit; text-align: left;
        background: none; border: 0; margin: 0; cursor: pointer;
        display: grid;
        grid-template-columns: 2.1rem 1fr auto 1rem;
        align-items: baseline;
        gap: 8px;
        padding: clamp(8px, 1.45vh, 13px) 0;
        transition: opacity 0.25s, color 0.25s;
      }
      .num { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
      .title { font-size: 17px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.3; }
      .tag { font-size: 13px; color: var(--ink-3); }
      .arrow { font-size: 13px; opacity: 0; transform: translate(-4px, 2px); transition: opacity 0.2s, transform 0.25s; }
      .list.has-active .row { opacity: 0.32; }
      .list.has-active .row.active { opacity: 1; }
      .row.active .arrow, .row:focus-visible .arrow { opacity: 1; transform: none; }

      /* ---- Phones and narrow windows: stack name / dots / list ---- */
      @media (max-width: 860px) {
        .page {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr) auto;
          gap: 8px;
          align-items: stretch;
          padding: max(20px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
        }
        h1 { font-size: clamp(2.1rem, 1.2rem + 4vw, 2.8rem); }
        .hello { margin-bottom: 6px; font-size: 13px; }
        .lede { margin-top: 12px; font-size: 14px; max-width: 30rem; }
        .links { margin-top: 12px; font-size: 13px; }
        .caption { font-size: 13px; bottom: 0; }
        .caption b { font-size: 12px; }
        .tabs { margin-bottom: 6px; }
        .tabs button { font-size: 13px; }
        .list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; border-bottom: 0; }
        .list li:nth-last-child(-n + 2) { border-bottom: 1px solid var(--line); }
        .row { grid-template-columns: 1.4rem 1fr; padding: 9px 0; gap: 2px; }
        .title { font-size: 13.5px; letter-spacing: -0.02em; line-height: 1.25; }
        .num { font-size: 11px; }
        .tag, .arrow { display: none; }
      }
      @media (max-width: 860px) and (max-height: 700px) {
        /* Short phones: keep the first paragraph, a touch smaller. */
        .lede { font-size: 13px; line-height: 1.5; margin-top: 8px; }
        .lede + .lede { display: none; }
        .links { margin-top: 8px; }
      }
      @media (max-width: 860px) and (max-height: 600px) {
        .lede { display: none; }
      }
      @media (max-width: 360px) {
        .tabs { gap: 4px 12px; }
        .tabs button { font-size: 12px; }
      }
      @media (min-width: 861px) and (max-height: 620px) {
        .lede { display: none; }
        .links { margin-top: 16px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .caption.in { animation: none; }
        .row, .arrow, .lists > .list, .tabs button::after { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <button class="theme" id="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
    <main class="page">
      <header class="intro">
        <h1><span class="hello">{{hello}}</span> {{first}}.</h1>
        <!--intro-->
        <nav class="links" aria-label="Elsewhere"><!--links--></nav>
      </header>

      <div class="slot" id="slot">
        <p class="caption" id="caption" aria-live="polite">
          <span class="hint-mouse">Hover anything on the right to see it in dots.</span>
          <span class="hint-touch">Tap anything below to see it in dots.</span>
        </p>
      </div>

      <section class="work" aria-label="Work, projects, life and milestones">
        <!--sections-->
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
